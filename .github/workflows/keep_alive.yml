name: Keep Alive
on:
  schedule:
    # Runs every 50 minutes (Render sleeps after 15, 
    # but 50 is plenty to keep Supabase happy and Render warm enough)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -f https://auth-swagger.hemantagrawal.in || exit 1
